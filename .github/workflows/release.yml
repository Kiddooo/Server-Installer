name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go get .

      - name: Run tests
        run: go test ./...

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p release
          LDFLAGS="-s -w \
            -X ftb-server-downloader/util.ReleaseVersion=${VERSION} \
            -X ftb-server-downloader/util.GitCommit=${GITHUB_SHA::6}"

          GOOS=linux   GOARCH=amd64 go build -ldflags "$LDFLAGS" -o release/server-installer-linux-amd64       .
          GOOS=linux   GOARCH=arm64 go build -ldflags "$LDFLAGS" -o release/server-installer-linux-arm64       .
          GOOS=linux   GOARCH=arm   go build -ldflags "$LDFLAGS" -o release/server-installer-linux-arm         .
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o release/server-installer-windows-amd64.exe .

      - name: Create checksums
        working-directory: release
        run: sha256sum * > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
